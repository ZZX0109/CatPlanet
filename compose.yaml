services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: miaoxing
      POSTGRES_PASSWORD: local-only-password
      POSTGRES_DB: miaoxing
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miaoxing"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  db-data:
